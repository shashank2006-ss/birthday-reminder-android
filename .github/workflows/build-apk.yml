name: Build Birthday Reminder APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    - name: Build Debug APK
      run: |
        gradle assembleDebug --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk BirthdayReminder.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BirthdayReminder-Debug-APK
        path: BirthdayReminder.apk
        retention-days: 14

    - name: Publish Direct APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest
        name: "Birthday Reminder APK (Latest)"
        body: |
          ### 🎂 Birthday Reminder Android App
          **Direct Phone Download:**
          Tap the **`BirthdayReminder.apk`** file below to download and install directly on your Android phone (no laptop or cable required!).
        files: BirthdayReminder.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
